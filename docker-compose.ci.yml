# CI compose-smoke: skip Ollama model pull; worker stays up for PDF extraction E2E.
services:
  ollama:
    profiles: [ci-heavy]

  ollama-init:
    image: alpine:3.20
    entrypoint: ['sh', '-c', 'exit 0']
    depends_on: !reset []

  db-storage-guard:
    pull_policy: build

  migrate:
    pull_policy: build

  api:
    pull_policy: build
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-docuvate-ci-compose-better-auth-signing-key-2026}
      DV_ALLOW_SIGNUP: 'true'
      # Ollama is not started in compose-smoke; avoid ~4s DNS/connect stalls on settings.
      OLLAMA_URL: ''
      WORKER_DEPENDENCY_TIMEOUT_MS: '2500'
      # Smoke profile may exercise layout compare UI (tenant resolves via env default).
      DOCUVATE_FEATURE_LAYOUT_RECONSTRUCTION_COMPARE: 'true'

  worker:
    pull_policy: build

  web:
    pull_policy: build
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
