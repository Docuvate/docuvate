[mypy]
python_version = 3.12
strict = true
warn_return_any = true
warn_unused_ignores = true
files = model_gates, run_model_gates.py
mypy_path = ..:../apps/worker

[[mypy-numpy.*]]
ignore_missing_imports = true

[[mypy-docuvate_worker.*]]
ignore_missing_imports = true

[[mypy-tests.*]]
ignore_missing_imports = true
