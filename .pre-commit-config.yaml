#
# Optional local hooks: `pipx install pre-commit && pre-commit install`.
# CI runs the same gitleaks version via scripts/ci/gitleaks-scan.sh.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
