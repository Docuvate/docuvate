# kind + local registry (see kind-smoke.sh: host :5001, in-cluster kind-registry:5000).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.configs."kind-registry:5000".tls]
      insecure_skip_verify = true
nodes:
  - role: control-plane
    image: kindest/node:v1.30.4@sha256:976ea815844d5fa93be213437e3ff5754cd599b040946b5cca43ca45c2047114
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
