# Helm profile aligned with deploy/kustomize/overlays/dev (minus kind-only NodePort/Ingress patches).
ingress:
  className: traefik
  host: localhost

config:
  publicWebUrl: http://localhost:8080
  publicApiUrl: http://localhost:8080/api
  smtpUrl: smtp://docuvate-mailpit:1025
  documentChatProvider: context
  sftpPublicHost: localhost
  sftpPublicPort: "30222"

postgres:
  enabled: true

minio:
  enabled: true

valkey:
  enabled: true

mailpit:
  enabled: true

sftpIngest:
  enabled: true
  exposeSftp: true

ollama:
  enabled: false

migrate:
  enabled: true

api:
  replicas: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1

web:
  replicas: 1

worker:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  startupProbe:
    failureThreshold: 90
    periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1

secrets:
  create: false
