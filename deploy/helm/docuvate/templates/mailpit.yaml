{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvate-mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-mailpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: docuvate-mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docuvate-mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
{{- end }}
