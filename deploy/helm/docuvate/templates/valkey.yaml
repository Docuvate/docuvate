{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvate-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docuvate-valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docuvate-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docuvate-valkey
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-valkey
{{- end }}
