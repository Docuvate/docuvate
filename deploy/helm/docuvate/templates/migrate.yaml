{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "docuvate-db-migrate-%s" (include "docuvate.versionSuffix" .) }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-db-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: PGUSER
              value: docuvate
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h docuvate-postgres -U docuvate; do sleep 2; done",
            ]
          securityContext:
            {{- include "docuvate.containerSecurityRestricted" . | nindent 12 }}
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "docuvate.apiImage" . }}
          workingDir: /app/apps/api
          command: {{- toYaml .Values.migrate.command | nindent 10 }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
