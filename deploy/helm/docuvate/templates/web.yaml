apiVersion: v1
kind: ServiceAccount
metadata:
  name: docuvate-web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docuvate-web-nginx
data:
  default.conf: |
    server {
      listen 8080;
      client_max_body_size 25m;
      root /usr/share/nginx/html;
      index index.html;
      location ~ \.mjs$ {
        default_type application/javascript;
      }
      location /api/auth/ {
        proxy_pass http://docuvate-api:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /api/ {
        proxy_pass http://docuvate-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvate-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-web
    spec:
      serviceAccountName: docuvate-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "docuvate.webImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: docuvate-web-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docuvate-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docuvate-web
  ports:
    - name: http
      port: 80
      targetPort: http
