{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: docuvate-ollama
spec:
  serviceName: docuvate-ollama
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-ollama
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.ollama.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: docuvate-ollama
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docuvate-ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docuvate-ollama
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-ollama
{{- end }}
