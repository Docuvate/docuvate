apiVersion: v1
kind: ServiceAccount
metadata:
  name: docuvate-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuvate-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-api
    spec:
      serviceAccountName: docuvate-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "docuvate.apiImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: docuvate-config
          env:
            - name: PORT
              value: "3001"
            - name: DOCUVATE_RUN_MIGRATIONS_ON_START
              value: "false"
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: docuvate-config
                  key: DOCUVATE_PUBLIC_WEB_URL
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: docuvate-config
                  key: DOCUVATE_PUBLIC_WEB_URL
            - name: DOCUVATE_API_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: docuvate-config
                  key: DOCUVATE_PUBLIC_API_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: BETTER_AUTH_SECRET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_SECRET_KEY
            - name: WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WORKER_SECRET
            - name: DOCUVATE_CONNECTOR_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DOCUVATE_CONNECTOR_SECRETS_KEY
                  optional: true
            {{- if .Values.sftpIngest.enabled }}
            - name: DOCUVATE_SFTP_PULL_GATEWAY_URL
              value: http://docuvate-sftp-ingest:8080
            - name: DOCUVATE_SFTP_INGEST_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DOCUVATE_SFTP_INGEST_SERVICE_KEY
            - name: DOCUVATE_SERVICE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DOCUVATE_SERVICE_API_KEYS
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docuvate-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docuvate-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docuvate-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docuvate-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPU }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docuvate-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docuvate-api
