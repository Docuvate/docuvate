apiVersion: v1
kind: Service
metadata:
  name: docuvate-sftp-ingest
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: sftp
      port: 2222
      targetPort: sftp
      nodePort: 30222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docuvate-sftp-ingest
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: docuvate-api
      ports:
        - port: 8080
          protocol: TCP
    # Kubelet HTTP probes and dev port-forwards hit :8080 from outside pod selectors.
    - ports:
        - port: 8080
          protocol: TCP
    - ports:
        - port: 2222
          protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docuvate-config
data:
  DOCUVATE_SFTP_PUBLIC_HOST: localhost
  DOCUVATE_SFTP_PUBLIC_PORT: "30222"
