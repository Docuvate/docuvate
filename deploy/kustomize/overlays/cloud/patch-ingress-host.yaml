apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docuvate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.docuvate.example.com
      secretName: docuvate-tls
  rules:
    - host: app.docuvate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docuvate-web
                port:
                  name: http
