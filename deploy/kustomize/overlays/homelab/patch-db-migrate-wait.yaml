apiVersion: batch/v1
kind: Job
metadata:
  name: docuvate-db-migrate-0-1-0
spec:
  template:
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          env:
            - name: PGUSER
              value: docuvate
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h docuvate-postgres -U docuvate; do sleep 2; done",
            ]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
