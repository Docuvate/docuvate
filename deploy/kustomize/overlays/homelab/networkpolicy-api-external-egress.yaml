apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docuvate-api-external-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docuvate-api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 587
          protocol: TCP
