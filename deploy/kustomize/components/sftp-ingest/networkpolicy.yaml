apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docuvate-sftp-ingest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docuvate-sftp-ingest
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: docuvate-api
      ports:
        - port: 8080
          protocol: TCP
