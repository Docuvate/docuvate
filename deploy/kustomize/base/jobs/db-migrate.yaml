apiVersion: batch/v1
kind: Job
metadata:
  name: docuvate-db-migrate-0-1-0
  labels:
    app.kubernetes.io/name: docuvate-db-migrate
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docuvate-db-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: docuvate-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docuvate-api
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/api
          command: ["node", "dist/shared/infrastructure/database/run-migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docuvate-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
