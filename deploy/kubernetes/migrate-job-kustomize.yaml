# Reference Kustomize / Argo CD migrate Job (sync before API and worker).
apiVersion: batch/v1
kind: Job
metadata:
  name: docuvate-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: docuvate-api:latest # set by kustomize image transformer
          workingDir: /app/apps/api
          command:
            - node
            - dist/shared/infrastructure/database/run-migrate.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docuvate-database
                  key: url
