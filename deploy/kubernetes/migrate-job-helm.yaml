# Reference Helm hook Job for TypeORM migrate (#86 may replace with chart values).
# Same command as Compose `migrate` service.
apiVersion: batch/v1
kind: Job
metadata:
  name: docuvate-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: docuvate-api:latest # set by release
          workingDir: /app/apps/api
          command:
            - node
            - dist/shared/infrastructure/database/run-migrate.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docuvate-database
                  key: url
