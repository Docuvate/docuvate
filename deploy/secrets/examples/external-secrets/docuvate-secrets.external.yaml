apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docuvate-secrets
  namespace: docuvate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: docuvate-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: docuvate/prod/database-url
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: docuvate/prod/better-auth-secret
    - secretKey: BETTER_AUTH_URL
      remoteRef:
        key: docuvate/prod/better-auth-url
    - secretKey: DOCUVATE_API_PUBLIC_URL
      remoteRef:
        key: docuvate/prod/api-public-url
    - secretKey: WEB_ORIGIN
      remoteRef:
        key: docuvate/prod/web-origin
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: docuvate/prod/s3-access-key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: docuvate/prod/s3-secret-key
    - secretKey: WORKER_SECRET
      remoteRef:
        key: docuvate/prod/worker-secret
