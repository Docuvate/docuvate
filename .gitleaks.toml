title = "Docuvate gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known test fixtures and local dev defaults"
paths = [
  '''^pnpm-lock\.yaml$''',
]

regexes = [
  '''docuvate-secret''',
  '''(LabelsScreenshot1!|ReadmeScreenshot1!|TestPass123!)''',
  # Synthetic OCR test phrase, not a credential.
  '''E2E_SYNTHETIC_FIXTURE_PHRASE_\w*''',
]
