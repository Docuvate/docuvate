# Isolated lab stack — never use project name `docuvate` or live volume names.
# Usage:
#   docker compose -p docuvate-lab -f docker-compose.yml -f docker-compose.lab.yml --profile chat-local up -d --build
name: docuvate-lab

services:
  postgres:
    ports: !override
      - '55433:5432'
    volumes: !override
      - lab_pgdata:/var/lib/postgresql

  minio:
    ports: !override
      - '19010:9000'
      - '19011:9001'
    volumes: !override
      - lab_miniodata:/data

  valkey:
    ports: !override
      - '16379:6379'

  api:
    ports: !override
      - '13001:3001'
    environment:
      BETTER_AUTH_URL: http://localhost:15173
      DOCUVATE_API_PUBLIC_URL: http://localhost:13001
      WEB_ORIGIN: http://localhost:15173
      OLLAMA_URL: ${LAB_OLLAMA_URL:-http://host.docker.internal:11434}

  worker:
    ports: !override
      - '18000:8000'
    volumes: !override
      - lab_workermlcache:/var/lib/docuvate-ml

  mailpit:
    ports: !override
      - '127.0.0.1:18025:8025'

  web:
    ports: !override
      - '15173:80'

  site:
    ports: !override
      - '18081:80'

  sftp-ingest:
    ports: !override
      - '12222:2222'

volumes:
  lab_pgdata:
  lab_miniodata:
  lab_workermlcache:
