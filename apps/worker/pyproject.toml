[project]
name = "docuvate-worker"
version = "0.1.0"
description = "Docuvate extraction worker"
license = "LicenseRef-Docuvate-SUL-1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "setuptools>=75.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "Pillow>=11.0.0",
  "pdf2image>=1.17.0",
  "pdfplumber>=0.11.0",
  "pypdf>=5.0.0",
  "numpy>=1.26.0,<2",
  "scipy>=1.11.0,<2",
  "paddleocr==2.9.1",
  "paddlepaddle==3.3.1; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
  "paddlepaddle==3.2.2; platform_machine == 'aarch64' or platform_machine == 'arm64'",
  "opencv-python-headless>=4.8.0,<5.0.0",
  "scikit-image>=0.24.0,<0.26.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "fastembed>=0.4.2",
]

[project.optional-dependencies]
dev = [
  "psycopg[binary]>=3.2.0",
  "pytest>=8.3.0",
  "ruff==0.16.10",
  "testcontainers>=4.9.0",
  "fpdf2>=2.8.0",
  "pyright==1.1.396",
  "mypy==1.14.1",
  "scipy-stubs>=1.11.0,<1.18",
]
tesseract = [
  "pytesseract>=0.3.13",
]
docling = [
  "docling>=2.134.0",
]
donut = [
  "transformers>=4.44.0",
  "torch>=2.2.0",
  "accelerate>=0.33.0",
]

[tool.uv]
# CPU worker images and local `uv pip install` should resolve PyTorch from the CPU index
# (see scripts/ci/worker-docker-install.sh and check-worker-cpu-torch-resolution.sh).
torch-backend = "cpu"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ANN", "PL", "PT"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-dummy-args = true

[tool.ruff.lint.per-file-ignores]
"src/docuvate_worker/infrastructure/layout/**/*.py" = ["ANN", "PLR0915", "SIM102", "SIM110"]

[tool.ruff.lint.pylint]
max-args = 12
max-positional-args = 8
max-branches = 20
max-returns = 8
max-statements = 80

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src/docuvate_worker"]
exclude = ["src/docuvate_worker/infrastructure/layout/"]

[[tool.mypy.overrides]]
module = "docuvate_worker.presentation.schemas"
disable_error_code = ["typeddict-unknown-key"]

[[tool.mypy.overrides]]
module = [
  "paddleocr.*",
  "paddle.*",
  "cv2.*",
  "pdf2image.*",
  "pdfplumber.*",
  "pypdf.*",
  "skimage.*",
  "fastembed.*",
  "transformers.*",
  "torch.*",
  "accelerate.*",
  "docling.*",
  "pytesseract.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportUnusedImport = "none"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportIncompatibleMethodOverride = "warning"
reportUnusedFunction = "warning"
venvPath = "."
venv = ".venv"
include = ["src/docuvate_worker"]
exclude = ["src/docuvate_worker/infrastructure/layout"]
stubPath = "typings"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
