version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - container-images
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
