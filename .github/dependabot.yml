version: 2
updates:
  - package-ecosystem: docker
    # Dockerfiles live per app; there is none at the repo root.
    directories:
      - /apps/api
      - /apps/web
      - /apps/site
      - /apps/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - container-images
    commit-message:
      prefix: chore(deps)
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
