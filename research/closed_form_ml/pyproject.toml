[project]
name = "closed-form-ml-research"
version = "0.1.0"
description = "Docuvate closed-form ML research harness (CPU, no LLM training)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26.0,<2",
  "scipy>=1.11.0,<2",
  "scikit-learn>=1.5.0",
  "pydantic>=2.9.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
